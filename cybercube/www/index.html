<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07070f">
  <title>Cube Clean</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 글자는 i18n.js가 data-i18n 키로 채움 (여기 적힌 영어는 기본값) -->

  <!-- 스테이지 선택 화면 -->
  <div id="stageScreen" class="app screen">
    <header>
      <h1>CUBE<span>CLEAN</span></h1>
      <button id="langBtn" class="secondary small lang">🌐 English</button>
    </header>
    <!-- 도움말 · 아이템 · 랭킹 · 점수 -->
    <div class="header-right top-row">
      <button id="helpBtn" class="secondary icon" data-i18n-aria="howTo" aria-label="How to play">?</button>
      <button id="itemsBtn" class="secondary icon items-btn" data-i18n-aria="items" aria-label="Items">🎒</button>
      <button id="rankBtn" class="secondary icon" data-i18n-aria="ranking" aria-label="Ranking">🏆</button>
      <div class="box"><label data-i18n="score">SCORE</label><b id="totalStars" class="coin-num">0</b></div>
    </div>
    <div id="tierTabs" class="tabs"></div>
    <div id="stageGrid" class="stage-grid"></div>
    <div id="shop" class="shop"></div>
    <div class="legend">
      <div><i class="tile blue"></i><span data-i18n="step">STEP</span></div>
      <div><i class="tile red"></i><span data-i18n="avoid">AVOID</span></div>
      <div><i class="tile green"></i><span data-i18n="safe">SAFE</span></div>
    </div>
    <div class="footer">
      <button id="soundBtn" class="secondary small" data-i18n="soundOn">♪ ON</button>
      <a href="privacy.html" data-i18n="privacy">PRIVACY</a>
      <!-- 광고 모드 전환 · 점수 초기화: 시험용 (출시 전에 없앰). 둘은 늘 나란히 -->
      <div class="test-btns">
        <button id="modeBtn" class="secondary small mode" data-i18n="adTest">AD MODE · TEST</button>
        <button id="resetBtn" class="secondary small mode reset" data-i18n="resetScore">RESET SCORE</button>
      </div>
      <!-- 배포 시각: 폰에 최신 버전이 떴는지 확인용 (시험용, 출시 전에 없앰) -->
      <small id="buildTag" class="build-tag"></small>
    </div>
  </div>

  <!-- 게임 화면 -->
  <div id="gameScreen" class="app screen hidden">
    <div class="topbar">
      <button id="backBtn" class="secondary icon" data-i18n-aria="stages" aria-label="Stages">◀</button>
      <div id="stageName" class="stage-name">STAGE 1</div>
      <div class="topbar-right">
        <button id="gameItemsBtn" class="secondary icon items-btn" data-i18n-aria="items" aria-label="Items">🎒</button>
        <button id="pauseBtn" class="secondary icon" data-i18n-aria="paused" aria-label="Pause">Ⅱ</button>
      </div>
    </div>

    <div class="hud">
      <div class="box"><label data-i18n="blue">BLUE</label><b id="blueLeft">0</b></div>
      <div class="box"><label data-i18n="score">SCORE</label><b id="score" class="coin-num">0</b></div>
      <div class="box"><label data-i18n="time">TIME</label><b id="timeLeft">0</b></div>
      <div class="box"><label data-i18n="life">LIFE</label><b id="lives" class="lives">♥♥♥</b></div>
    </div>
    <div class="timebar"><div id="timeFill"></div></div>

    <div id="boardWrap" class="board-wrap">
      <div id="board" class="board">
        <div id="player" class="player">
          <div class="hold-ring"></div>
          <div class="orb">
            <svg class="crack" viewBox="0 0 100 100" aria-hidden="true"></svg>
          </div>
        </div>
      </div>
      <div id="countdown" class="countdown hidden"></div>
      <div id="clearBanner" class="clear-banner hidden"></div>
    </div>
    <!-- 아이템 버튼 + 그 위에 잠깐 뜨는 안내 (안내는 자리를 차지하지 않음 → 판을 크게) -->
    <div class="item-dock">
      <p id="itemBar" class="item-bar"></p>
      <div id="gameItems" class="game-items"></div>
    </div>
  </div>

  <!-- 시연 화면: 처음 실행할 때 + 스테이지 화면의 ? 버튼 -->
  <div id="demoScreen" class="app screen hidden">
    <div class="topbar">
      <div class="stage-name" data-i18n="howTo">HOW TO PLAY</div>
      <button id="demoSkip" class="secondary small" data-i18n="skip">SKIP</button>
    </div>
    <div class="demo-caption">
      <b id="demoTitle"></b>
      <span id="demoSub"></span>
    </div>
    <div class="demo-hud">
      <span id="demoBlue"></span>
      <span id="demoLives" class="lives"></span>
    </div>
    <div id="demoTimer" class="timebar demo-timer"><div id="demoTimeFill"></div></div>
    <div class="demo-wrap">
      <div id="demoBoard" class="board demo-board">
        <div id="demoPlayer" class="player">
          <div class="hold-ring"></div>
          <div class="orb">
            <svg class="crack" viewBox="0 0 100 100" aria-hidden="true"></svg>
          </div>
        </div>
        <div id="demoSwipe" class="swipe"><span>➜</span></div>
        <div id="demoTap" class="demo-tap"><i></i></div>
      </div>
      <div id="demoBadge" class="demo-badge hidden"></div>
    </div>
    <div id="demoDots" class="demo-dots"></div>
    <label class="intro-check"><input type="checkbox" class="hide-intro"> <span data-i18n="dontShowAgain">Don't show this again</span></label>
    <!-- 레벨별 빨강 안내에만: 체크하면 그 레벨은 다음부터 안 보임 -->
    <label class="intro-check red-check hidden"><input type="checkbox" id="hideRedGuide"> <span data-i18n="dontShowAgain">Don't show this again</span></label>
    <div class="demo-nav">
      <button id="demoPrev" class="secondary icon" data-i18n-aria="prev" aria-label="Previous">◀</button>
      <button id="demoStart" data-i18n="start">START ▶</button>
      <button id="demoNext" class="secondary icon" data-i18n-aria="nextAria" aria-label="Next">▶</button>
    </div>
  </div>

  <!-- 시작 안내 2단계: 개인정보처리방침 (전문을 앱 안에서 보여줌) -->
  <div id="privacyScreen" class="app screen hidden">
    <div class="topbar">
      <div class="stage-name" data-i18n="privacyTitle">PRIVACY POLICY</div>
    </div>
    <iframe id="privacyFrame" class="privacy-frame" title="Privacy Policy"></iframe>
    <label class="intro-check"><input type="checkbox" class="hide-intro"> <span data-i18n="dontShowAgain">Don't show this again</span></label>
    <button id="privacyOk" class="privacy-ok" data-i18n="introNext">NEXT ▶</button>
  </div>

  <!-- 일시정지 / 클리어 / 실패 -->
  <div id="modal" class="modal hidden">
    <div class="panel">
      <h2 id="modalTitle">PAUSED</h2>
      <div id="modalStars" class="stars"></div>
      <p id="modalText"></p>
      <div id="modalBody"></div>
      <div id="modalButtons" class="buttons"></div>
    </div>
  </div>

  <!-- 브라우저용 가짜 광고 (출시 모드 흐름 확인용, 폰 앱에서는 실제 AdMob 광고) -->
  <div id="adOverlay" class="ad-overlay hidden">
    <div class="ad-box">
      <small data-i18n="adSimulated">SIMULATED</small>
      <b id="adLabel">AD</b>
      <div id="adCount" class="ad-count">5</div>
      <button id="adClose" class="secondary hidden" data-i18n="adClose">CLOSE ✕</button>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="firebase-config.js"></script>
  <script src="cloud.js"></script>
  <script src="stages.js"></script>
  <script src="ads-config.js"></script>
  <script src="ads.js"></script>
  <script src="sound.js"></script>
  <script src="crack.js"></script>
  <script src="orb.js"></script>
  <script src="demo.js"></script>
  <script src="version.js"></script>
  <script src="game.js"></script>
</body>
</html>
