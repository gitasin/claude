<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07070f">
  <title>Cyber Cube</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 스테이지 선택 화면 -->
  <div id="stageScreen" class="app screen">
    <header>
      <h1>CYBER<span>CUBE</span></h1>
      <div class="header-right">
        <button id="rankBtn" class="secondary icon" aria-label="Ranking">🏆</button>
        <div class="box"><label>STARS</label><b id="totalStars">★ 0</b></div>
      </div>
    </header>
    <div id="stageGrid" class="stage-grid"></div>
    <!-- 규칙은 색 타일로만 표시 (언어 상관없이 이해 가능) -->
    <div class="legend">
      <div><i class="tile blue"></i><span>STEP</span></div>
      <div><i class="tile red"></i><span>AVOID</span></div>
      <div><i class="tile green"></i><span>SAFE</span></div>
    </div>
    <div class="footer">
      <button id="soundBtn" class="secondary small">♪ ON</button>
      <a href="privacy.html">PRIVACY</a>
    </div>
  </div>

  <!-- 게임 화면 -->
  <div id="gameScreen" class="app screen hidden">
    <div class="topbar">
      <button id="backBtn" class="secondary icon" aria-label="Stages">◀</button>
      <div id="stageName" class="stage-name">STAGE 1</div>
      <button id="pauseBtn" class="secondary icon" aria-label="Pause">Ⅱ</button>
    </div>

    <div class="hud">
      <div class="box"><label>BLUE</label><b id="blueLeft">0</b></div>
      <div class="box"><label>TIME</label><b id="timeLeft">0</b></div>
      <div class="box"><label>LIFE</label><b id="lives" class="lives">♥♥♥</b></div>
    </div>
    <div class="timebar"><div id="timeFill"></div></div>

    <div id="boardWrap" class="board-wrap">
      <div id="board" class="board">
        <div id="player" class="player"></div>
      </div>
      <div id="countdown" class="countdown hidden"></div>
    </div>
    <p class="hint">SWIPE ↑ ↓ ← →</p>
  </div>

  <!-- 일시정지 / 클리어 / 실패 -->
  <div id="modal" class="modal hidden">
    <div class="panel">
      <h2 id="modalTitle">PAUSED</h2>
      <div id="modalStars" class="stars"></div>
      <p id="modalText"></p>
      <div id="modalBody"></div>
      <div id="modalButtons" class="buttons"></div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="cloud.js"></script>
  <script src="stages.js"></script>
  <script src="game.js"></script>
</body>
</html>
